<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiana Cyprus — превью футера</title>
<style>
html, body { margin: 0; width: 100%; background: #fff; }
iframe { display: block; width: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="preview" title="Предпросмотр главной страницы Tiana Cyprus" src="/preview/footer-foot-nav-20261025.html?rev=44528f750dc0bcd6c06de393082bfd6b7c5c726f"></iframe>
<script>
(() => {
  const frame = document.getElementById("preview");
  let resizeFrame;
  function fitPreview() {
    const doc = frame.contentDocument;
    if (!doc || !doc.head || !doc.body) return;
    let style = doc.getElementById("footer-gradient-preview");
    if (!style) {
      style = doc.createElement("style");
      style.id = "footer-gradient-preview";
      style.textContent = `
        @media (min-width: 761px) {
          .footer-photo::after {
            background: linear-gradient(
              to bottom,
              rgba(0, 0, 0, .09) 0%,
              rgba(0, 0, 0, .10) 25%,
              rgba(0, 0, 0, .115) 50%,
              rgba(0, 0, 0, .135) 66%,
              rgba(0, 0, 0, .17) 88%,
              rgba(0, 0, 0, .17) 100%
            ) !important;
          }
        }
      `;
      doc.body.appendChild(style);
    }
    frame.style.height = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight) + "px";
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      window.scrollTo(0, Math.max(0, document.documentElement.scrollHeight - window.innerHeight));
    });
  }
  frame.addEventListener("load", fitPreview);
  window.addEventListener("resize", fitPreview);
})();
</script>
</body>
</html>
